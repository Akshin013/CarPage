<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Профиль автолюбителя</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070b;
        --text: #f4f6fa;
        --accent: #ff3b30;
        --accent2: #ff9500;
        --glass: rgba(255, 255, 255, 0.08);
        --line: rgba(255, 255, 255, 0.16);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Фон: размытая копия видео, даёт мягкое свечение вокруг */
      .amb {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 20%, #1d2233 0, #06070b 70%);
      }
      .amb video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(40px) saturate(1.5) brightness(0.55);
        transform: scale(1.3);
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 420px;
        margin: 0 auto;
        padding: calc(14px + env(safe-area-inset-top, 0px)) 14px
          calc(18px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Блок видео */
      .stage {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 38vh;
        border-radius: 28px;
        overflow: hidden;
        background: #0d1018;
        border: 1px solid var(--line);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.6),
          0 0 70px rgba(255, 59, 48, 0.22);
      }
      .stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .stage svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 140%;
        transform: translate(-50%, -50%);
      }
      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.25) 0,
          rgba(0, 0, 0, 0) 25%,
          rgba(0, 0, 0, 0) 70%,
          rgba(6, 7, 11, 0.55) 100%
        );
      }

      /* Аватар на краю видео */
      .ava {
        position: relative;
        z-index: 2;
        width: 92px;
        height: 92px;
        margin-top: -48px;
        border-radius: 50%;
        padding: 3px;
        flex: none;
        background: conic-gradient(
          from 200deg,
          var(--accent),
          var(--accent2),
          var(--accent)
        );
        box-shadow:
          0 0 0 5px var(--bg),
          0 0 30px rgba(255, 59, 48, 0.6);
      }
      .ava div {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background: #14161d;
        display: grid;
        place-items: center;
        font-size: 34px;
        font-weight: 700;
      }
      .ava img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      [hidden] {
        display: none !important;
      }
      .car {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 16px;
        color: #d5d9e3;
      }
      .car svg {
        width: 20px;
        height: 20px;
        color: var(--accent);
        flex: none;
      }
      .car b {
        color: var(--text);
      }
      .car button {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .car button:hover {
        border-color: var(--accent);
      }
      .caredit {
        display: flex;
        gap: 6px;
        width: 100%;
        margin: 0 0 12px;
      }
      .caredit input {
        flex: 1;
        min-width: 0;
        height: 40px;
        padding: 0 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        font: inherit;
        font-size: 15px;
        outline: none;
      }
      .caredit input:focus {
        border-color: var(--accent);
      }
      .caredit button {
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .plate {
        display: flex;
        align-items: stretch;
        height: 36px;
        margin: 0 0 16px;
        border-radius: 7px;
        overflow: hidden;
        background: #fff;
        color: #111;
        border: 2px solid #111;
        box-shadow: 0 0 22px rgba(255, 200, 80, 0.5);
      }
      .plate i {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 30px;
        background: #0b3d91;
        color: #fff;
        font-style: normal;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.1;
      }
      .plate i::before {
        content: "";
        width: 14px;
        height: 9px;
        margin-bottom: 2px;
        border-radius: 1px;
        background: linear-gradient(#00b5e2 33%, #ef3340 33% 66%, #509e2f 66%);
      }
      .plate b {
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-family: "Arial Black", Impact, Arial, sans-serif;
        font-size: 19px;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }

      /* Соцсети: ряд иконок */
      .icons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        width: 100%;
      }
      .ico {
        display: grid;
        place-items: center;
        height: 54px;
        border-radius: 16px;
        color: var(--text);
        background: var(--glass);
        border: 1px solid var(--line);
        transition:
          transform 0.2s,
          background 0.2s,
          border-color 0.2s;
      }
      .ico:hover {
        transform: translateY(-3px);
        background: rgba(255, 59, 48, 0.22);
        border-color: var(--accent);
      }
      .ico svg {
        width: 24px;
        height: 24px;
      }

      .qrb {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 50px;
        margin-top: 10px;
        border: 0;
        border-radius: 16px;
        cursor: pointer;
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);
        transition: filter 0.2s;
      }
      .qrb:hover {
        filter: brightness(1.1);
      }
      .qrb svg {
        width: 20px;
        height: 20px;
      }

      .rise {
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.on {
        display: flex;
      }
      .box {
        background: #fff;
        color: #111;
        border-radius: 24px;
        padding: 24px;
        text-align: center;
        max-width: 320px;
        width: 100%;
      }
      .box #qr {
        display: flex;
        justify-content: center;
        margin: 14px 0;
      }
      .box p {
        margin: 4px 0;
        font-size: 12px;
        color: #555;
        word-break: break-all;
      }
      .box button {
        width: 100%;
        margin-top: 12px;
        font: inherit;
        font-weight: 600;
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Размытый фон из того же видео -->
    <div class="amb">
      <video id="amb" autoplay muted loop playsinline>
        <source src="video/car.mp4" type="video/mp4" />
        <source src="video/car.webm" type="video/webm" />
      </video>
    </div>

    <main>
      <!-- БЛОК С ВИДЕО: video/car.mp4. Если файла нет, показывается рисунок машины -->
      <section class="stage rise">
        <svg id="fallback" viewBox="0 0 800 420" aria-hidden="true">
          <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d12a22" />
              <stop offset="1" stop-color="#5a0d0a" />
            </linearGradient>
            <radialGradient id="glow">
              <stop offset="0" stop-color="#fff" stop-opacity=".95" />
              <stop offset="1" stop-color="#ffd9a0" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect x="120" y="318" width="90" height="70" rx="14" fill="#0b0b0e" />
          <rect x="590" y="318" width="90" height="70" rx="14" fill="#0b0b0e" />
          <path
            d="M130 300 Q130 210 215 150 L300 70 Q400 40 500 70 L585 150 Q670 210 670 300 L670 345 Q400 372 130 345 Z"
            fill="url(#body)"
          />
          <path
            d="M232 150 L305 85 Q400 62 495 85 L568 150 Q400 128 232 150Z"
            fill="#0d1018"
            stroke="#2a2f3d"
            stroke-width="3"
          />
          <circle cx="205" cy="228" r="60" fill="url(#glow)" />
          <circle cx="595" cy="228" r="60" fill="url(#glow)" />
          <path d="M290 245 L510 245 L535 300 L265 300Z" fill="#090a0f" />
          <rect x="340" y="318" width="120" height="28" rx="4" fill="#f2f4f8" />
        </svg>
        <video
          id="vid"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          poster="video/poster.jpg"
        >
          <source src="video/car2.mp4" type="video/mp4" />
          <source src="video/car.webm" type="video/webm" />
        </video>
      </section>

      <!-- АВАТАР: положи фото в img/avatar.jpg. Нет фото, будет буква -->
      <div class="ava rise" style="animation-delay: 0.1s">
        <div id="ava"><img src="video/foto.jpg" alt="" id="avaImg" /></div>
      </div>

      <!-- ИМЯ И ФАМИЛИЯ: поменяй здесь -->
      <h1 class="rise" style="animation-delay: 0.16s" id="name">
        Badir__990
      </h1>

      <!-- МАРКА И МОДЕЛЬ: по умолчанию меняются в script (DEFAULT_CAR), а также кнопкой ✎ на странице -->
      <div class="car rise" id="carBox" style="animation-delay: 0.18s">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5A1.5 1.5 0 0 1 21 12.5V17h-2v1.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V17H8v1.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V17H3v-4.500A1.500 1.500 0 0 1 4.500 11zm3.400-4-1 3h9.200l-1-3zM6.500 13.500a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm11 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
          />
        </svg>
        <span id="carText"></span>
        <button id="carEdit" aria-label="Изменить машину" title="Изменить">
          ✎
        </button>
      </div>
      <div class="caredit" id="carForm" hidden>
        <input
          id="brand"
          placeholder="Марка (BMW)"
          maxlength="20"
          autocomplete="off"
        />
        <input
          id="model"
          placeholder="Модель (M3)"
          maxlength="20"
          autocomplete="off"
        />
        <button id="carSave">OK</button>
      </div>

      <!-- НОМЕР МАШИНЫ: поменяй текст внутри <b>. Чтобы убрать, удали эту строку -->
      <div class="plate rise" style="animation-delay: 0.2s">
        <i>AZ</i><b>99 · HB · 990</b>
      </div>

      <!-- ССЫЛКИ: замени ТВОЙ_НИК на свой -->
      <nav class="icons">
        <a
          class="ico rise"
          style="animation-delay: 0.26s"
          href="https://instagram.com/badir_990"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
          title="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle
              cx="17.5"
              cy="6.5"
              r="1"
              fill="currentColor"
              stroke="none"
            /></svg
        ></a>
        <a
          class="ico rise"
          style="animation-delay: 0.31s"
          href="https://t.me/ТВОЙ_НИК"
          target="_blank"
          rel="noopener"
          aria-label="Telegram"
          title="Telegram"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M21.5 3.6 2.8 10.8c-.8.3-.8 1.4 0 1.6l4.6 1.5 1.8 5.6c.2.6 1 .8 1.4.3l2.6-2.5 4.6 3.4c.5.4 1.3.1 1.4-.5L23 5c.2-.8-.7-1.7-1.5-1.4zM9.8 14l8-6.5-6.3 7.2-.3 3z"
            /></svg
        ></a>
        <a
          class="ico rise"
          style="animation-delay: 0.36s"
          href="https://www.tiktok.com/@badir__990?_r=1&_t=ZS-9BB9XrUmWKy"
          target="_blank"
          rel="noopener"
          aria-label="TikTok"
          title="TikTok"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M16.6 3c.3 2.3 1.7 3.8 4 4v3.1c-1.5 0-2.9-.4-4-1.2v6.2c0 3.2-2.4 5.4-5.4 5.4s-5.4-2.3-5.4-5.3c0-3.3 2.8-5.6 6.1-5.2v3.2c-1.6-.4-2.9.5-2.9 2 0 1.2 1 2.2 2.2 2.2 1.4 0 2.3-.9 2.3-2.4V3z"
            /></svg
        ></a>
        <a
          class="ico rise"
          style="animation-delay: 0.41s"
          href="https://youtube.com/@ТВОЙ_КАНАЛ"
          target="_blank"
          rel="noopener"
          aria-label="YouTube"
          title="YouTube"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M22 8.2c-.2-1.5-1-2.3-2.5-2.5C17.8 5.4 12 5.4 12 5.4s-5.8 0-7.5.3C3 6 2.2 6.7 2 8.2 1.8 9.7 1.8 12 1.8 12s0 2.3.2 3.8c.2 1.5 1 2.3 2.5 2.5 1.7.3 7.5.3 7.5.3s5.8 0 7.5-.3c1.5-.2 2.3-1 2.5-2.5.2-1.5.2-3.8.2-3.8s0-2.3-.2-3.8zM10 15V9l5 3z"
            /></svg
        ></a>
      </nav>

      <button class="qrb rise" style="animation-delay: 0.46s" id="qrBtn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3h-3z" />
        </svg>
        QR-код профиля
      </button>
    </main>

    <div class="modal" id="modal">
      <div class="box">
        <strong>Сканируй и знакомься</strong>
        <div id="qr"></div>
        <p id="url"></p>
        <button id="close">Закрыть</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      // Когда выложишь сайт в интернет, впиши ссылку, например "https://autoid.site/alex"
      var PROFILE_URL = "";

      // Аватар: если фото нет, показываем первую букву имени
      document.getElementById("avaImg").onerror = function () {
        document.getElementById("ava").textContent = document
          .getElementById("name")
          .textContent.trim()
          .charAt(0);
      };

      // Видео: если файла нет, остаётся рисунок машины
      var vid = document.getElementById("vid");
      var amb = document.getElementById("amb");
      var fb = document.getElementById("fallback");
      vid.style.display = "none";
      vid.addEventListener("playing", function () {
        vid.style.display = "block";
        fb.style.display = "none";
      });
      vid.addEventListener(
        "error",
        function () {
          vid.style.display = "none";
          fb.style.display = "block";
          amb.style.display = "none";
        },
        true,
      );
      [vid, amb].forEach(function (v) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });

      // Марка и модель. Значение по умолчанию (его видят все, кто открыл сайт):
      var DEFAULT_CAR = { brand: "BMW", model: "5" };
      var car = DEFAULT_CAR;
      try {
        var saved = JSON.parse(localStorage.getItem("car"));
        if (saved && saved.brand) car = saved;
      } catch (e) {}
      var carText = document.getElementById("carText");
      var carBox = document.getElementById("carBox");
      var carForm = document.getElementById("carForm");
      var brandIn = document.getElementById("brand");
      var modelIn = document.getElementById("model");
      function renderCar() {
        carText.textContent = "";
        var b = document.createElement("b");
        b.textContent = car.brand;
        carText.appendChild(b);
        carText.appendChild(document.createTextNode(" " + (car.model || "")));
      }
      renderCar();
      document.getElementById("carEdit").onclick = function () {
        brandIn.value = car.brand;
        modelIn.value = car.model || "";
        carBox.hidden = true;
        carForm.hidden = false;
        brandIn.focus();
      };
      function saveCar() {
        var b = brandIn.value.trim();
        if (b) {
          car = { brand: b, model: modelIn.value.trim() };
          try {
            localStorage.setItem("car", JSON.stringify(car));
          } catch (e) {}
          renderCar();
        }
        carForm.hidden = true;
        carBox.hidden = false;
      }
      document.getElementById("carSave").onclick = saveCar;
      [brandIn, modelIn].forEach(function (i) {
        i.onkeydown = function (e) {
          if (e.key === "Enter") saveCar();
        };
      });

      // QR-код
      var modal = document.getElementById("modal");
      document.getElementById("qrBtn").onclick = function () {
        var link = PROFILE_URL || location.href;
        var box = document.getElementById("qr");
        box.innerHTML = "";
        document.getElementById("url").textContent = link;
        try {
          new QRCode(box, { text: link, width: 220, height: 220 });
        } catch (e) {
          box.textContent = "QR не загрузился (нужен интернет)";
        }
        modal.classList.add("on");
      };
      document.getElementById("close").onclick = function () {
        modal.classList.remove("on");
      };
      modal.onclick = function (e) {
        if (e.target === modal) modal.classList.remove("on");
      };
    </script>
  </body>
</html>
